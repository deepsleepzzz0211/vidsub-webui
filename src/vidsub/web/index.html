<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vidsub · 双语字幕</title>
<style>
  :root { color-scheme: light dark; --ok:#2e7d32; --err:#c62828; }
  * { box-sizing: border-box; }
  body {
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    margin: 0; min-height: 100vh; display: grid; place-items: start center;
  }
  main { max-width: 52rem; padding: 2.5rem 1.5rem 4rem; width: 100%; }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
  .lede { margin: 0 0 1.5rem; opacity: .78; }
  .box {
    border: 2px dashed currentColor; border-radius: 12px;
    padding: 2.5rem 1.5rem; text-align: center; opacity: .85; cursor: pointer;
  }
  .box strong { display: block; margin-bottom: .35rem; font-size: 1.05rem; }
  .meta { margin: 1.2rem 0; font-size: .92rem; opacity: .85; }
  button {
    font: inherit; padding: .5rem 1.1rem; border-radius: 9px; cursor: pointer;
    border: 1px solid currentColor; background: transparent; color: inherit;
  }
  button:disabled { opacity: .45; cursor: default; }
  .job {
    border: 1px solid rgba(128,128,128,.3); border-radius: 10px;
    padding: .9rem 1rem; margin-bottom: .7rem;
  }
  .job .row { display: flex; justify-content: space-between; gap: 1rem; }
  .job .name { font-weight: 600; }
  .state { font-size: .85rem; margin-top: .2rem; }
  .state.done { color: var(--ok); }
  .state.failed { color: var(--err); }
  .bar { height: 6px; border-radius: 99px; background: rgba(128,128,128,.25); margin-top: .5rem; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: currentColor; }
  .errmsg { color: var(--err); font-size: .85rem; margin-top: .3rem; white-space: pre-wrap; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>vidsub</h1>
  <p class="lede">上传视频，得到中英双语字幕。全程本地运行，不联网调用任何接口。</p>

  <div class="box" id="drop">
    <strong>拖拽视频到这里</strong>
    或点击选择文件
    <input type="file" id="file" accept="video/*,audio/*" style="display:none">
  </div>
  <div id="meta" class="meta"></div>

  <h2 style="font-size:1rem;margin:1.6rem 0 .6rem">作业</h2>
  <div id="jobs"></div>

  <footer style="margin-top:2rem;font-size:.8rem;opacity:.6">
    全程本地 · 采样温度 0.0（同输入产出一致） · <a href="/downloads">模型下载页</a>
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);

function fmt(n) {
  if (n == null) return '—';
  if (n >= 1073741824) return (n / 1073741824).toFixed(2) + ' GB';
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
  return Math.round(n / 1024) + ' KB';
}
function dur(s) {
  if (!s && s !== 0) return '—';
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  const h = Math.floor(m / 60);
  return h ? `${h}:${String(m % 60).padStart(2, '0')}:${String(sec).padStart(2, '0')}`
           : `${m}:${String(sec).padStart(2, '0')}`;
}

async function upload(file) {
  $('meta').textContent = `已选择 ${file.name}（${fmt(file.size)}），探测中…`;
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch('/api/jobs', { method: 'POST', body: fd });
  const b = await r.json();
  if (!r.ok) {
    $('meta').textContent = '失败：' + (b.error || r.statusText);
    return;
  }
  const i = b.info || {};
  $('meta').textContent =
    `${file.name} · 时长 ${dur(i.duration)} · ${i.width || '—'}×${i.height || '—'} · ${fmt(i.size_bytes || file.size)}`;
  watchJob(b.id);
  poll();
}

async function poll() {
  try {
    const r = await fetch('/api/jobs');
    const jobs = (await r.json()).jobs || [];
    $('jobs').innerHTML = jobs.length ? jobs.map(renderJob).join('')
      : '<p style="opacity:.5">还没有作业</p>';
  } catch (e) { /* 忽略轮询异常 */ }
}

function renderJob(j) {
  const p = j.progress || {};
  const ratio = p.total ? Math.min(1, p.i / p.total) : 0;
  const stateMap = { pending: '排队中', running: '处理中', done: '完成', failed: '失败' };
  return `<div class="job" id="job-${j.id}">
    <div class="row"><span class="name">${j.filename}</span>
      <span>${dur(j.info && j.info.duration)} · ${j.info && j.info.width ? j.info.width + '×' + j.info.height : ''}</span></div>
    <div class="state ${j.state}">${stateMap[j.state] || j.state} · ${p.label || ''}</div>
    ${j.state === 'running' ? `<div class="bar"><i style="width:${ratio * 100}%"></i></div>` : ''}
    ${j.state === 'failed' ? `<div class="errmsg">${(j.error || '').split('\n')[0]}</div>` : ''}
    ${j.state === 'done' ? `<a href="/api/jobs/${j.id}/srt" target="_blank">下载字幕</a>` : ''}
    ${j.state === 'done' && j.burn_state !== 'done' ?
      `<button onclick="burn('${j.id}')" ${j.burn_state === 'running' ? 'disabled' : ''}>${j.burn_state === 'failed' ? '重新压制' : '压制成片'}</button>` : ''}
    ${j.burn_state === 'running' ? `<div class="state running">压制中…</div>` : ''}
    ${j.burn_state === 'failed' ? `<div class="errmsg">${(j.error || '').split('\n')[0]}</div>` : ''}
    ${j.burn_state === 'done' ? `<a href="/api/jobs/${j.id}/video" target="_blank">预览成片</a>` : ''}
  </div>`;
}

function watchJob(jobId) {
  try {
    const es = new EventSource(`/api/jobs/${jobId}/stream`);
    es.onmessage = (e) => {
      const j = JSON.parse(e.data);
      const row = document.getElementById('job-' + jobId);
      if (row) {
        const p = j.progress || {};
        const ratio = p.total ? Math.min(1, p.i / p.total) : 0;
        const bar = row.querySelector('.bar > i');
        if (bar) bar.style.width = (ratio * 100) + '%';
        const st = row.querySelector('.state');
        if (st) st.textContent = ({done:'完成',failed:'失败',running:'处理中',pending:'排队中'})[j.state] + ' · ' + (p.label || '') + '';
        if (j.state === 'failed') {
          const e2 = row.querySelector('.errmsg');
          if (e2) e2.textContent = (j.error || '').split('\n')[0];
        }
      }
      if (j.state === 'done' || j.state === 'failed') { es.close(); poll(); }
    };
    es.onerror = () => { es.close(); };
  } catch (e) { /* EventSource 不可用就退回轮询 */ }
}

async function burn(jobId) {
  const r = await fetch(`/api/jobs/${jobId}/burn`, { method: 'POST' });
  const b = await r.json();
  if (!r.ok) {
    alert('压制失败：' + (b.error || r.statusText));
    return;
  }
  poll();
}

$('drop').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => e.target.files[0] && upload(e.target.files[0]));
$('drop').addEventListener('dragover', (e) => { e.preventDefault(); });
$('drop').addEventListener('drop', (e) => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
});

poll();
setInterval(poll, 1200);
</script>
</body>
</html>
